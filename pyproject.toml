[project]
name = "aa-case-02-oil-price-prediction"
version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (==2.5.4)",
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (==2.15.0+cpu)",
    "streamlit (==1.67.0)",
    "plotly (==7.1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
